<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="armorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1e38" />
      <stop offset="100%" stop-color="#0f1123" />
    </linearGradient>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="60" cy="60" r="58" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.25)" stroke-width="3" />

  <!-- Inner ambient ring -->
  <circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" stroke-dasharray="4 3" />

  <!-- Gladiator Armor / Shoulders -->
  <path d="M26 106 C26 84, 40 76, 60 76 C80 76, 94 84, 94 106 Z" fill="url(#armorGrad)" stroke="#4338ca" stroke-width="2" />

  <!-- Shoulder Plates -->
  <path d="M24 95 Q38 86 52 88 L48 106 L24 106 Z" fill="#2d2b55" opacity="0.8" />
  <path d="M96 95 Q82 86 68 88 L72 106 L96 106 Z" fill="#2d2b55" opacity="0.8" />
  <path d="M60 76 L60 106" stroke="#00f5ff" stroke-width="1.5" opacity="0.7" />

  <!-- Head / Helmet -->
  <ellipse cx="60" cy="52" rx="22" ry="24" fill="url(#armorGrad)" stroke="#6366f1" stroke-width="2" />

  <!-- Helmet Crest / Fin -->
  <path d="M57 24 Q60 14 63 24 L62 44 L58 44 Z" fill="url(#visorGrad)" filter="url(#glow)" />

  <!-- Helmet Visor / Eye Guard -->
  <path d="M42 48 Q60 54 78 48 L76 56 Q60 62 44 56 Z" fill="url(#visorGrad)" filter="url(#glow)" />
  <line x1="45" y1="52" x2="75" y2="52" stroke="#ffffff" stroke-width="1.5" opacity="0.9" />

  <!-- Face Plate Details -->
  <polygon points="56,64 64,64 62,70 58,70" fill="#312e81" />
  <line x1="52" y1="67" x2="68" y2="67" stroke="#06b6d4" stroke-width="1" opacity="0.8" />
</svg>
