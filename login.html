<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login to Arena – Study Battle</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="responsive.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="logo-badge">
          <div class="logo-icon-wrap">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
            </svg>
          </div>
          <div class="logo-text">Study<span>Battle</span></div>
        </a>
        <h2>Welcome Back, Gladiator</h2>
        <p>Enter your credentials to enter the battle arena</p>
      </div>

      <!-- ERROR ALERT CONTAINER -->
      <div id="loginError" class="form-error" style="background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); padding: 0.75rem 1rem; border-radius: var(--radius-md); margin-bottom: 1.25rem;"></div>

      <form id="loginForm" onsubmit="event.preventDefault();" novalidate autocomplete="off" data-form-type="other">
        <!-- Anti-autofill decoy inputs to block modern browser suggestion dropdowns -->
        <input type="text" name="decoy_user" tabindex="-1" style="display:none;" autocomplete="off" />
        <input type="password" name="decoy_pass" tabindex="-1" style="display:none;" autocomplete="new-password" />

        <!-- Email Input -->
        <div class="form-group">
          <label class="form-label" for="loginEmail">Email Address</label>
          <div class="input-wrap">
            <span class="input-icon-left">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
            </span>
            <input type="email" id="loginEmail" name="gladiator_login_email" class="input-field" placeholder="name@studybattle.dev" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-autocomplete="none" data-lpignore="true" data-1p-ignore data-form-type="other" required>
          </div>
        </div>

        <!-- Password Input -->
        <div class="form-group">
          <div class="flex-between mb-1">
            <label class="form-label" for="loginPassword" style="margin-bottom: 0;">Password</label>
            <a href="#" id="forgotPasswordLink" style="font-size: 0.8rem; color: var(--accent-purple-light);">Forgot Password?</a>
          </div>
          <div class="input-wrap">
            <span class="input-icon-left">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input type="password" id="loginPassword" name="gladiator_login_password" class="input-field" placeholder="••••••••" autocomplete="new-password" autocorrect="off" autocapitalize="off" spellcheck="false" aria-autocomplete="none" data-lpignore="true" data-1p-ignore data-form-type="other" required>
            <button type="button" class="input-btn-right password-toggle-btn" data-target="loginPassword" aria-label="Toggle password visibility">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <!-- Remember Me Checkbox & Quick Demo Fill -->
        <div class="flex-between mb-2">
          <label class="checkbox-wrap">
            <input type="checkbox" id="rememberMe" checked>
            <span>Remember this device</span>
          </label>
          <button type="button" id="quickDemoFillBtn" style="background: none; border: none; color: var(--accent-cyan); font-size: 0.78rem; cursor: pointer; text-decoration: underline;">Fill Demo Login</button>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="loginSubmitBtn" class="btn btn-primary btn-block btn-lg">
          <span>Enter Battle Arena</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>

      <div class="auth-divider">or explore arena</div>

      <!-- GUEST ACCESS / DIRECT DASHBOARD (RETAINED AS REQUESTED) -->
      <a href="dashboard.html" id="guestAccessBtn" class="btn btn-secondary btn-block">
        <span>Guest Access / Direct Dashboard</span>
      </a>

      <div class="auth-footer-text">
        Don't have a gladiator account? <a href="signup.html">Create Account</a>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="auth.js"></script>
</body>
</html>
